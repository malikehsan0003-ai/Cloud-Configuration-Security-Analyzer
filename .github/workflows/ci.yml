# ─────────────────────────────────────────────────────────────
# GitHub Actions CI — Tests + Security Checks
# ─────────────────────────────────────────────────────────────
name: CI — Tests & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-security:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Lint checks ────────────────────────────────────
      - name: Run ESLint
        run: npm run lint

      # ── Run tests ──────────────────────────────────────
      - name: Run unit & integration tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      # ── Dependency security audit ──────────────────────
      - name: npm audit (production dependencies)
        run: npm audit --production --audit-level=high
        continue-on-error: true

      # ── Run automated analysis on sample config ────────
      - name: Analyze risky sample config
        run: node scripts/analyze.js samples/risky-config.json || true
        # Expected to return exit code 1 (critical findings exist)

      - name: Analyze safe sample config
        run: node scripts/analyze.js samples/safe-config.json
        # Expected to return exit code 0 (no critical/high findings)

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloud-security-analyzer:ci .

      - name: Test Docker container health
        run: |
          docker run -d --name csa-test -p 3000:3000 cloud-security-analyzer:ci
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop csa-test
          docker rm csa-test
